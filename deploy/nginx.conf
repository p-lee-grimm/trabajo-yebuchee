# nginx in front of the app. TLS is required: the Telegram login widget and the session
# cookie (Secure) only work over https. Certificates e.g. with certbot --nginx.
server {
    listen 443 ssl;
    server_name jobs.example.com;

    # ssl_certificate     /etc/letsencrypt/live/jobs.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jobs.example.com/privkey.pem;

    client_max_body_size 20m;   # CV / document uploads

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
